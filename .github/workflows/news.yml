name: Refresh news

# Rebuilds news.json (headlines from public crypto news RSS feeds, tagged by coin)
# for the page every 30 minutes. Browsers can't read these feeds directly, so it
# runs here; no API keys are involved.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build news.json
        run: python scripts/build_news.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Refresh news"
          git push
